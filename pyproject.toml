[project]
name = "healthcore-python-workspace"
version = "0.1.0"
description = "Python workspace for HealthCore services and scripts"
requires-python = ">=3.14"
dependencies = ["api"]

[dependency-groups]
data-analysis = ["pandas>=2.2.3"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["services/api"]

[tool.uv.sources]
api = { workspace = true }
